<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0008">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons8-star-scribby-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons8-star-scribby-32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/icons8-star-scribby-96.png">
  <link rel="apple-touch-icon" sizes="96x96" href="/icons8-star-scribby-96.png">
  <title>Our Story: A Love Quest</title>
  <style>
    /* Expose iOS/Android safe-area insets as CSS custom properties so
       Phaser scenes can read them via getComputedStyle on document.body.  */
    :root {
      --safe-top:    env(safe-area-inset-top,    0px);
      --safe-right:  env(safe-area-inset-right,  0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left:   env(safe-area-inset-left,   0px);
    }
    html {
      height: 100%;
      /* iOS Safari: prevent URL bar from shrinking the layout viewport */
      height: -webkit-fill-available;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0008;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    body {
      /* iOS Safari fill-available fallback — the URL bar should not crunch the canvas */
      min-height: -webkit-fill-available;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #game-container canvas {
      display: block;
      /* Canvas must fill the container exactly on mobile */
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      /* Let WebGL own its own pixel buffer — no browser interpolation filter */
      image-rendering: auto;
      /* Promote canvas to its own compositor layer for GPU-direct presentation */
      will-change: transform;
      /* Prevent any inherited opacity/blending from ancestors softening pixels */
      isolation: isolate;
      /* AAA mobile: suppress all browser-native touch feedback on the canvas.
         -webkit-tap-highlight-color: body rule cascades but Safari needs it
         explicitly on the element receiving touch. outline:none kills the
         browser focus ring. touch-action/callout are belt-and-suspenders. */
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-touch-callout: none;
      outline: none;
      touch-action: none;
    }
    /* Hide the OS mouse cursor on the canvas for touch-only devices.
       pointer:coarse = touchscreen / stylus; pointer:fine = mouse/trackpad.
       This keeps the desktop cursor unchanged. */
    @media (pointer: coarse) {
      #game-container canvas {
        cursor: none;
      }
    }

    /* ── Orientation overlay ─────────────────────────────────────────────── */
    /*
     * Sits above everything in the DOM via z-index 9999.
     * Hidden by default (opacity 0, pointer-events none, scaleY 0.96 for a
     * subtle scale-in entrance). Adding .visible triggers the transition.
     *
     * The overlay does NOT use display:none so the transition plays — if we
     * used display:none the browser can't animate from it.
     */
    #orientation-overlay {
      position:       fixed;
      inset:          0;                    /* top/right/bottom/left: 0 */
      z-index:        9999;
      display:        flex;
      align-items:    center;
      justify-content: center;
      /* Dark frosted-glass background */
      background:     radial-gradient(ellipse at 50% 40%,
                        rgba(30, 10, 48, 0.96) 0%,
                        rgba(8,  4,  18, 0.98) 100%);
      /* Smooth entrance/exit */
      opacity:        0;
      transform:      scaleY(0.96);
      pointer-events: none;
      transition:     opacity 280ms ease, transform 280ms ease;
      /* Prevent any click/touch from reaching the canvas while visible */
      -webkit-tap-highlight-color: transparent;
      touch-action:   none;
      user-select:    none;
    }
    #orientation-overlay.visible {
      opacity:        1;
      transform:      scaleY(1);
      pointer-events: all;
    }

    /* Inner content — centred column */
    .orient-inner {
      display:        flex;
      flex-direction: column;
      align-items:    center;
      gap:            clamp(12px, 3vw, 24px);
      padding:        clamp(24px, 6vw, 48px);
      text-align:     center;
      /* Soft top-edge glow — gives the card a premium depth */
      background:     linear-gradient(
                        to bottom,
                        rgba(180, 100, 200, 0.06) 0%,
                        transparent 60%
                      );
      border-radius:  clamp(14px, 3vw, 24px);
    }

    /* Phone icon — scales with viewport min dimension */
    .orient-icon {
      width:          clamp(52px, 14vmin, 88px);
      height:         clamp(52px, 14vmin, 88px);
      color:          rgba(240, 210, 255, 0.85);
      /* Pulse animation — gentle, not distracting */
      animation:      orient-pulse 2.8s ease-in-out infinite;
    }
    .orient-icon svg {
      width:  100%;
      height: 100%;
      /* drop-shadow gives the SVG a soft bloom matching the rose-violet palette */
      filter: drop-shadow(0 0 8px rgba(200, 140, 255, 0.35));
    }

    /* Arrow inside the SVG rotates independently — implies "turn this way" */
    .orient-arrow {
      transform-origin: 34px 14px;           /* pivot near the corner */
      animation:        orient-arrow 2.8s ease-in-out infinite;
    }

    /* Primary text */
    .orient-text {
      font-family:    'Georgia', 'Times New Roman', serif;
      font-size:      clamp(15px, 4vmin, 22px);
      font-weight:    normal;
      color:          rgba(255, 240, 255, 0.92);
      letter-spacing: 0.04em;
      /* Subtle text-shadow bloom */
      text-shadow:    0 0 20px rgba(200, 120, 255, 0.30);
      margin:         0;
    }

    /* Sub-text */
    .orient-sub {
      font-family:    'Georgia', 'Times New Roman', serif;
      font-size:      clamp(11px, 2.6vmin, 15px);
      color:          rgba(180, 155, 200, 0.62);
      letter-spacing: 0.05em;
      margin:         0;
    }

    /* Keyframes ─────────────────────────────────────────────────────────── */
    @keyframes orient-pulse {
      0%, 100% { opacity: 1;    transform: scale(1);    }
      50%       { opacity: 0.72; transform: scale(0.94); }
    }

    @keyframes orient-arrow {
      0%, 40%, 100% { transform: rotate(0deg);   opacity: 1;    }
      20%            { transform: rotate(-22deg); opacity: 0.60; }
    }

    /* Tablet: slightly larger text — same logic, clamp handles it automatically */
    /* Landscape on tablet: overlay is hidden anyway so no extra rule needed   */

    /* ── Fullscreen toggle button ───────────────────────────────────────────── */
    #fs-btn {
      position:       fixed;
      top:            12px;
      right:          12px;
      z-index:        1000;         /* above canvas; below orientation-overlay (9999) */
      width:          44px;
      height:         44px;
      background:     rgba(0, 0, 0, 0.38);
      border:         1px solid rgba(255, 255, 255, 0.14);
      border-radius:  10px;
      cursor:         pointer;
      display:        flex;
      align-items:    center;
      justify-content: center;
      color:          rgba(255, 255, 255, 0.65);
      transition:     background 180ms ease, color 180ms ease;
      padding:        0;
      -webkit-tap-highlight-color: transparent;
      touch-action:   manipulation;   /* fast tap, no 300ms delay */
    }
    #fs-btn:hover,
    #fs-btn:focus-visible {
      background: rgba(0, 0, 0, 0.62);
      color:      rgba(255, 255, 255, 0.92);
    }
    #fs-btn:focus-visible {
      outline:        2px solid rgba(180, 120, 255, 0.70);
      outline-offset: 2px;
    }
    /* hidden attribute used by JS when API unavailable (iOS Safari) */
    #fs-btn[hidden] { display: none !important; }
    .fs-icon               { width: 20px; height: 20px; display: none; pointer-events: none; }
    .fs-icon.fs-visible    { display: block; }

    /* ── iOS “Add to Home Screen” prompt ─────────────────────────────────── */
    #ios-aths {
      position:        fixed;
      bottom:          0;
      left:            0;
      right:           0;
      z-index:         1100;          /* above fs-btn (1000), below orient-overlay (9999) */
      background:      linear-gradient(
                         to top,
                         rgba(8, 4, 18, 0.97) 0%,
                         rgba(18, 8, 36, 0.94) 100%
                       );
      border-top:      1px solid rgba(180, 120, 255, 0.18);
      padding:         16px 20px calc(16px + env(safe-area-inset-bottom, 0px)) 20px;
      display:         flex;
      align-items:     flex-start;
      gap:             14px;
      /* Slide-up entrance — starts hidden below viewport */
      transform:       translateY(100%);
      transition:      transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
      -webkit-tap-highlight-color: transparent;
    }
    #ios-aths.ios-aths-visible {
      transform: translateY(0);
    }
    #ios-aths[hidden] { display: none !important; }
    .aths-icon {
      flex-shrink:   0;
      width:         38px;
      height:        38px;
      background:    rgba(120, 60, 200, 0.18);
      border:        1px solid rgba(180, 120, 255, 0.22);
      border-radius: 10px;
      display:       flex;
      align-items:   center;
      justify-content: center;
      color:         rgba(200, 150, 255, 0.85);
    }
    .aths-body {
      flex:        1;
      min-width:   0;
    }
    .aths-title {
      font-family:   'Georgia', serif;
      font-size:     clamp(13px, 3.5vw, 15px);
      color:         rgba(240, 220, 255, 0.95);
      margin:        0 0 4px;
      line-height:   1.3;
    }
    .aths-sub {
      font-family:   'Georgia', serif;
      font-size:     clamp(11px, 2.8vw, 13px);
      color:         rgba(180, 155, 200, 0.65);
      margin:        0;
      line-height:   1.5;
    }
    .aths-sub b {
      color: rgba(210, 175, 255, 0.85);
      font-weight: normal;
    }
    .aths-close {
      flex-shrink:   0;
      background:    none;
      border:        none;
      color:         rgba(180, 155, 200, 0.55);
      font-size:     22px;
      line-height:   1;
      cursor:        pointer;
      padding:       0 2px;
      align-self:    flex-start;
      touch-action:  manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .aths-close:hover { color: rgba(255, 255, 255, 0.80); }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Fullscreen toggle — hidden via JS if API unavailable (iOS Safari) -->
  <button id="fs-btn" aria-label="Enter fullscreen">
    <!-- Enter fullscreen icon -->
    <svg class="fs-icon fs-visible" id="fs-enter" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
      <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
    <!-- Exit fullscreen icon -->
    <svg class="fs-icon" id="fs-exit" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
      <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
      <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
      <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
    </svg>
  </button>

  <!-- iOS Add-to-Home-Screen prompt — shown only on iPhone/iPad Safari when not
       already running in standalone (home screen) mode.                         -->
  <div id="ios-aths" role="complementary" aria-label="Add to Home Screen for fullscreen" hidden>
    <div class="aths-icon" aria-hidden="true">
      <!-- iOS Share sheet icon -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="aths-body">
      <p class="aths-title">Play fullscreen on iPhone</p>
      <p class="aths-sub">Tap <b>⧆ Share</b>, then <b>“Add to Home Screen”</b> — opens without Safari bars.</p>
    </div>
    <button class="aths-close" id="ios-aths-close" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Orientation overlay — shown by OrientationManager when device is portrait.
       Kept in HTML (not JS-generated) so the browser can parse and paint it
       before any JS runs, avoiding a flash of un-overlaid content on slow loads. -->
  <div id="orientation-overlay" role="dialog" aria-modal="true"
       aria-label="Please rotate your device">
    <div class="orient-inner">
      <!-- Phone + rotate arrow icon (inline SVG — no extra HTTP request) -->
      <div class="orient-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Phone body -->
          <rect x="13" y="4" width="22" height="38" rx="4"
                stroke="currentColor" stroke-width="2.2" fill="none"/>
          <!-- Home indicator -->
          <rect x="20" y="37" width="8" height="2" rx="1"
                fill="currentColor" opacity="0.5"/>
          <!-- Rotate arrow path -->
          <path class="orient-arrow"
                d="M33 10 L40 10 M40 10 L40 17 M40 10 L32 18"
                stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="orient-text">Rotate your device</p>
      <p class="orient-sub">This experience is designed for landscape</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>

  <!-- Fullscreen API — vendor-prefixed for cross-browser coverage.
       iOS Safari has no Fullscreen API; replaced by an Add-to-Home-Screen prompt. -->
  <script>
  (function () {
    var btn       = document.getElementById('fs-btn');
    var iconEnter = document.getElementById('fs-enter');
    var iconExit  = document.getElementById('fs-exit');

    // ── iOS “Add to Home Screen” prompt ─────────────────────────────
    // Detect iPhone/iPad/iPod Safari (not Chrome or Firefox on iOS which
    // use a different UA but still can't fullscreen).
    var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.maxTouchPoints > 0 && /Macintosh/.test(navigator.userAgent)); // iPadOS desktop mode
    // navigator.standalone === true when launched from home screen.
    var isStandalone = window.navigator.standalone === true;

    if (isIOS && !isStandalone) {
      var athsPanel = document.getElementById('ios-aths');
      var athsClose = document.getElementById('ios-aths-close');
      var autoTimer = null;

      function hideAths() {
        clearTimeout(autoTimer);
        athsPanel.classList.remove('ios-aths-visible');
        athsPanel.addEventListener('transitionend', function () {
          athsPanel.hidden = true;
        }, { once: true });
      }

      // Always show on every visit — slide up after a short settle delay.
      athsPanel.hidden = false;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          athsPanel.classList.add('ios-aths-visible');
          // Auto-dismiss after 6 s if the user doesn't tap ✕.
          autoTimer = setTimeout(hideAths, 6000);
        });
      });

      // Manual dismiss via ✕ also cancels the auto-timer.
      athsClose.addEventListener('click', hideAths);
    }

    // ── Fullscreen API (non-iOS) ─────────────────────────────────
    // Feature-detect: check all vendor prefixes.
    var el = document.documentElement;
    var canFS = !!(el.requestFullscreen ||
                   el.webkitRequestFullscreen ||
                   el.mozRequestFullScreen ||
                   el.msRequestFullscreen);

    if (!canFS) {
      // No API support — hide button (iOS already handled above).
      btn.hidden = true;
      return;
    }

    function isFullscreen() {
      return !!(document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement);
    }

    function enterFS() {
      if (el.requestFullscreen)       el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
      else if (el.msRequestFullscreen)     el.msRequestFullscreen();
    }

    function exitFS() {
      if (document.exitFullscreen)           document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
      else if (document.msExitFullscreen)     document.msExitFullscreen();
    }

    function syncIcon() {
      var fs = isFullscreen();
      btn.setAttribute('aria-label', fs ? 'Exit fullscreen' : 'Enter fullscreen');
      iconEnter.classList.toggle('fs-visible', !fs);
      iconExit.classList.toggle('fs-visible',   fs);
    }

    btn.addEventListener('click', function () {
      if (isFullscreen()) exitFS(); else enterFS();
    });

    // Keyboard shortcut: F key (matches native browser behaviour on desktop).
    document.addEventListener('keydown', function (e) {
      if (e.key === 'F' || e.key === 'f') {
        // Avoid hijacking when typing in an input element.
        if (document.activeElement && document.activeElement !== document.body) return;
        if (isFullscreen()) exitFS(); else enterFS();
      }
    });

    // Sync icon when the user exits fullscreen via Esc or browser controls.
    ['fullscreenchange',
     'webkitfullscreenchange',
     'mozfullscreenchange',
     'MSFullscreenChange'].forEach(function (ev) {
      document.addEventListener(ev, syncIcon);
    });
  })();
  </script>
</body>
</html>
